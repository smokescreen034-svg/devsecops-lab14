name: Security check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run static security analysis
        run: bandit -r app.py
